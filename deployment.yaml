apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app-deployment
  labels:
    app: nodejs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
        - name: nodejs-app
          image: aswin5352/shopzen-node-app:1.2
          ports:
            - containerPort: 3000  
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-app-service
spec:
  type: NodePort 
  selector:
    app: nodejs-app
  ports:
    - protocol: TCP
      port: 3000  
      targetPort: 3000  
      nodePort: 30100 
